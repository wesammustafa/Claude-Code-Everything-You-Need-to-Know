name: Weekly lesson quotes

# Runs the lesson-quotes check in scheduled mode: it fetches the practice
# template's learning app lesson files from its main branch and compares them
# with the lessons they quote. On a problem it opens, or updates, one tracking
# issue titled "Lesson quotes drifted from a lesson". It never opens a pull
# request.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lesson-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run the check
        id: check
        run: |
          set +e
          node .github/scripts/check.mjs --mode scheduled --only lesson-quotes > "$RUNNER_TEMP/check.txt" 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/check.txt"
      - name: Open or update the tracking issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/tracking-issue.sh "Lesson quotes drifted from a lesson" "$RUNNER_TEMP/check.txt"
