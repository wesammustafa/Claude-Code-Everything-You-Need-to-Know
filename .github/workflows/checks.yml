name: Guide checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which jobs this pull request needs, from the files it changes
  # (.github/scripts/ci-scope.mjs): a README or check-script change runs only
  # guide, an app unit test change adds quest, and anything that reaches the
  # build, the template or the app runs every job. A push to main and a
  # manual run run every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      app: ${{ steps.scope.outputs.app }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then node .github/scripts/ci-scope.mjs --base "$BASE_SHA"; else node .github/scripts/ci-scope.mjs; fi

  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install lychee
        run: .github/scripts/install-lychee.sh
      - name: Show the other tools the checks use
        run: ruby --version && shellcheck --version && jq --version
      - name: Self-test the checks against their fixtures
        run: node --test '.github/scripts/test/**/*.test.mjs'
      - name: Run the checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="HEAD^"; fi
          node .github/scripts/check.mjs --mode pr --base "$base"

  quest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:quest
      - name: Run the lesson test
        run: npm run test:lessons
      - run: npm run test:checks
      - run: npm run test:starter
      # The server bundle starts from a folder with no node_modules, on the
      # .nvmrc line and on Node 22, the oldest the app supports.
      - run: npm run build
      - run: node quest/server/test/smoke.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node quest/server/test/smoke.mjs

  # The build refuses any bundled module outside the shipped-package set,
  # Rive's WASM included, and the Pip contract test loads the committed pip.riv
  # in Chromium, offline, with the bundled WASM. Every e2e spec runs in full:
  # the shell, the b-1 slice and the browser security suite. Claude Code is
  # pinned to the CHANGELOG baseline, and the font instance check reads the
  # PostScript name only on macOS, the one platform that gives it.
  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Install Claude Code at the CHANGELOG baseline
        run: |
          v=$(sed -n 's/^Baseline: Claude Code v\([0-9.]*\) .*/\1/p' CHANGELOG.md) && test -n "$v" && npm i -g "@anthropic-ai/claude-code@$v" && claude --version
      # The e2e copy runs `claude` under a new, empty HOME: time that here, so
      # a hang or a failure there shows in the log on its own.
      - name: Time claude --version under an empty HOME
        run: |
          d=$(mktemp -d); rc=0; time HOME="$d" timeout 60 claude --version || rc=$?; echo "rc=$rc"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          QUEST_E2E_REAL_CLAUDE: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: quest/client/test-results
          if-no-files-found: ignore

  # The fresh-copy proof (npm run proof): two assemblies of the template from
  # one build, the Starter project's and the Checks' tests, every Check failing
  # on the fresh copy and passing after the full replay with Claude Code at the
  # CHANGELOG baseline, `npm run learn` offline on 127.0.0.1 with Chromium
  # loading a Lesson, the tree's layout, and identical bytes. It runs on
  # Ubuntu, on Node 22, the oldest the copy supports, and on the .nvmrc line.
  # Every row runs the upgrade proof (npm run upgrade:verify): README's
  # upgrade commands on a copy from the template's last Terminal app commit,
  # in bash on Ubuntu and macOS, and in Git Bash, pwsh and Windows PowerShell
  # on Windows. The build always runs on the .nvmrc line; the size and
  # start-up budgets run only on Ubuntu's, and their numbers go to the job
  # summary.
  template:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            leg: node-22
            node-version: '22'
            shell: bash
          - os: ubuntu-latest
            leg: nvmrc
            node-version-file: .nvmrc
            shell: bash
          - os: macos-latest
            leg: nvmrc
            node-version-file: .nvmrc
            shell: bash
          - os: windows-latest
            leg: nvmrc
            node-version-file: .nvmrc
            shell: bash
          - os: windows-latest
            leg: nvmrc
            node-version-file: .nvmrc
            shell: pwsh
          - os: windows-latest
            leg: nvmrc
            node-version-file: .nvmrc
            shell: powershell
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm run template -- "$RUNNER_TEMP/tpl"
      - if: matrix.os == 'ubuntu-latest' && matrix.leg == 'nvmrc'
        run: npm run budgets -- "$RUNNER_TEMP/tpl"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
      - run: npm run upgrade:verify -- --template "$RUNNER_TEMP/tpl" --shell ${{ matrix.shell }}
      - name: Install Claude Code at the CHANGELOG baseline
        if: matrix.os == 'ubuntu-latest'
        run: |
          v=$(sed -n 's/^Baseline: Claude Code v\([0-9.]*\) .*/\1/p' CHANGELOG.md) && test -n "$v" && npm i -g "@anthropic-ai/claude-code@$v" && claude --version
      - run: npx playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest'
      - run: npm run proof
        if: matrix.os == 'ubuntu-latest'

  # The Checks' tests, and `npm run learn` starting on an assembled copy with
  # no node_modules, offline, on 127.0.0.1, answering GET /api/health, on macOS
  # and on Windows in Git Bash. The full proof stays on Ubuntu: it needs the
  # replay, Chromium and an exit code on SIGTERM, which Windows never gives.
  # The upgrade proof runs on all three, in the template job.
  platforms:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run test:checks
      - run: npm run build
      - run: npm run template -- "$RUNNER_TEMP/tpl"
      - run: npm run startup -- "$RUNNER_TEMP/tpl"

  # The ruleset on main requires this job's check run, which GitHub names after
  # the job id. Renaming the job, or giving it a name:, would block every merge.
  # GitHub reports a skipped job as success and lets a skipped required check
  # through, so this job always runs and fails unless changes and guide
  # succeeded and every other job succeeded or was skipped because changes
  # found nothing for it to test.
  checks:
    needs: [changes, guide, quest, e2e, template, platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.changes.result == "success" and .guide.result == "success" and all(.[]; .result == "success" or .result == "skipped")' > /dev/null
