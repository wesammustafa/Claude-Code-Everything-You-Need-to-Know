name: Guide checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install lychee
        run: .github/scripts/install-lychee.sh
      - name: Show the other tools the checks use
        run: ruby --version && shellcheck --version && jq --version
      - name: Self-test the checks against their fixtures
        run: node --test '.github/scripts/test/**/*.test.mjs'
      - name: Run the checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="HEAD^"; fi
          node .github/scripts/check.mjs --mode pr --base "$base"

  quest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: exit 1 # deliberately failing: proves the gate, reverted next

  # The ruleset on main requires the check run named "checks", which this job
  # reports today. Keep the job id and add no name:, or that check may never
  # report and every merge would block.
  # GitHub reports a skipped job as success and lets a skipped required check
  # through, so this job always runs and fails unless every job it needs
  # succeeded.
  checks:
    needs: [guide, quest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
