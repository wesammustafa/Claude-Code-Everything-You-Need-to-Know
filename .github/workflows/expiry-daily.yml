name: Daily expiry markers

# Runs the expiry check in scheduled mode. On a problem it opens, or updates,
# one tracking issue titled "Expired facts in the guide". It never opens a pull request.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run the check
        id: check
        run: |
          set +e
          node .github/scripts/check.mjs --mode scheduled --only expiry > "$RUNNER_TEMP/check.txt" 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/check.txt"
      - name: Open or update the tracking issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/tracking-issue.sh "Expired facts in the guide" "$RUNNER_TEMP/check.txt"
