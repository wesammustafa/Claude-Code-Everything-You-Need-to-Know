<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Claude Code Quest. Claude Code: Everything You Need to Know. Learn Claude Code in three levels, from your first session to unattended multi-agent runs. Beside the title, Pip, the Claude Code Quest mascot, cheers with his arms up under falling confetti.">
  <!-- Source for social-card.png, rendered at 1280 by 640. Pip (social-card-pip.png) is a frame of his Celebration rendered from the rig, quest/client/pip/pip.riv, in the app's own web runtime; never redraw him by hand. Face: Inter (SIL OFL 1.1). Colors: the app's dark theme tokens. -->
  <defs>
    <radialGradient id="glow" cx="985" cy="330" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff784e" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff784e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff784e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b1020"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <image href="social-card-pip.png" xlink:href="social-card-pip.png" x="740" y="70" width="500" height="500"/>
  <g font-family="Inter Variable, Inter, Segoe UI, system-ui, sans-serif">
    <rect x="80" y="122" width="44" height="6" rx="3" fill="#ff784e"/>
    <text x="140" y="132" fill="#ff784e" font-weight="700" font-size="26" letter-spacing="3">CLAUDE CODE QUEST</text>
    <text x="78" y="232" fill="#eef1f8" font-weight="800" font-size="68" letter-spacing="-1.5">Claude Code:</text>
    <text x="78" y="312" fill="#eef1f8" font-weight="800" font-size="68" letter-spacing="-1.5">Everything You</text>
    <text x="78" y="392" fill="#eef1f8" font-weight="800" font-size="68" letter-spacing="-1.5">Need to Know</text>
    <text x="80" y="460" fill="#a9b3cc" font-weight="500" font-size="29">Learn Claude Code in three levels, from your</text>
    <text x="80" y="500" fill="#a9b3cc" font-weight="500" font-size="29">first session to unattended multi-agent runs.</text>
  </g>
</svg>
