<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Claude Code Quest. Learn Claude Code in three levels, from your first session to unattended multi-agent runs. Beside the title, Pip, the Claude Code Quest mascot, cheers with his arms up under falling confetti.">
  <!-- Source for social-card.png, rendered at 1280 by 640. Pip (social-card-pip.png) is a frame of his Celebration rendered from the rig, quest/client/pip/pip.riv, in the app's own web runtime; never redraw him by hand. Face: Inter (SIL OFL 1.1). Colors: the app's dark theme tokens. -->
  <defs>
    <radialGradient id="glow" cx="985" cy="330" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff784e" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff784e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff784e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b1020"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <image href="social-card-pip.png" xlink:href="social-card-pip.png" x="740" y="70" width="500" height="500"/>
  <g font-family="Inter Variable, Inter, Segoe UI, system-ui, sans-serif">
    <text x="76" y="236" fill="#eef1f8" font-weight="800" font-size="84" letter-spacing="-2">Claude Code</text>
    <text x="76" y="332" fill="#eef1f8" font-weight="800" font-size="84" letter-spacing="-2">Quest</text>
    <text x="80" y="412" fill="#a9b3cc" font-weight="500" font-size="29">Learn Claude Code in three levels, from your</text>
    <text x="80" y="452" fill="#a9b3cc" font-weight="500" font-size="29">first session to unattended multi-agent runs.</text>
  </g>
</svg>
