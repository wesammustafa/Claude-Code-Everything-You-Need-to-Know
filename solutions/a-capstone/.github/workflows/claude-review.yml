name: Claude review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: anthropics/claude-code-action@v1.0.258
        with:
          prompt: /team-review the changes in this pull request
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: --max-turns 5 --allowedTools "Read,Grep,Glob"
